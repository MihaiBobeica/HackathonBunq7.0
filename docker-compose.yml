services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "8001:8000"
    volumes:
      - bunq-context:/app/data

  frontend:
    build:
      context: ./bunq-sentinel
    environment:
      VITE_API_URL: http://127.0.0.1:8001
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  bunq-context:
