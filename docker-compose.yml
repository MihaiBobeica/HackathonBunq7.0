services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    ports:
      # Host 18000 -> container 8000
      - "18000:8000"

  frontend:
    build:
      context: ./bunq-sentinel
    environment:
      # Browser calls the backend through the host port.
      VITE_API_URL: http://127.0.0.1:18000
    ports:
      # Host 15173 -> container 5173 (Vite)
      - "15173:5173"
    depends_on:
      - backend
